name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
          working-directory: home_page

      - name: Build Jekyll site
        working-directory: home_page
        run: bundle exec jekyll build

      - name: Copy blueprint site into Pages artifact
        run: |
          rm -rf home_page/_site/blueprint
          mkdir -p home_page/_site/blueprint
          cp -R blueprint/web/. home_page/_site/blueprint/
          cp blueprint/src/print.pdf home_page/_site/blueprint.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: home_page/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
